name: Auto-merge Charlie PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [v2.1]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'charliecreates[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr \
            merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge \
            || echo "Auto-merge not enabled (already enabled or not mergeable yet)."
