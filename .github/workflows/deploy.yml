name: Deploy to GitHub Pages

on:
  push:
    branches: [v2.1]
  pull_request:
    branches: [v2.1]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROD_BRANCH: v2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Spotify client id (prod build/deploy)
        if: github.ref_name == env.PROD_BRANCH
        env:
          # Prefer an Actions repository variable; fall back to secrets for legacy setups.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID || secrets.VITE_SPOTIFY_CLIENT_ID || secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "${VITE_SPOTIFY_CLIENT_ID}" ] || [ "${VITE_SPOTIFY_CLIENT_ID}" = "REPLACE_ME_IN_.env.local" ]; then
            echo "Missing VITE_SPOTIFY_CLIENT_ID (required for GitHub Pages prod build/deploy)."
            echo "Set a repository Actions variable (preferred) or secret named VITE_SPOTIFY_CLIENT_ID (or SPOTIFY_CLIENT_ID)."
            exit 1
          fi

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID || secrets.VITE_SPOTIFY_CLIENT_ID || secrets.SPOTIFY_CLIENT_ID }}
        run: npm run build:prod

      - name: Deploy to GitHub Pages
        if: github.ref_name == env.PROD_BRANCH
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Notify charliehooks (Delivered + Accepted)
        if: github.ref_name == env.PROD_BRANCH && github.event_name == 'push'
        env:
          CHARLIEHOOKS_BASE_URL: ${{ vars.CHARLIEHOOKS_BASE_URL || 'https://charliehooks.pi.stags.wtf' }}
          CHARLIEHOOKS_SHARED_SECRET: ${{ secrets.CHARLIEHOOKS_SHARED_SECRET }}
        run: |
          if [ -z "$CHARLIEHOOKS_SHARED_SECRET" ]; then
            echo "Skipping: missing secret CHARLIEHOOKS_SHARED_SECRET"
            exit 0
          fi

          TEXT="$(jq -r '[.head_commit.message, (.commits[].message)] | join("\n")' "$GITHUB_EVENT_PATH")"
          printf '%s\n' "$TEXT" | grep -Eo 'CHA-[0-9]+' | sort -u > /tmp/linear_issues.txt || true
          ISSUES_JSON="$(jq -Rsc 'split("\n") | map(select(length>0))' /tmp/linear_issues.txt)"

          if [ "$ISSUES_JSON" = "[]" ]; then
            echo "Skipping: no Linear issue identifiers found in commit messages"
            exit 0
          fi

          PAYLOAD="$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --argjson issues "$ISSUES_JSON" \
            --argjson autoAccept true \
            '{repo:$repo, sha:$sha, issues:$issues, autoAccept:$autoAccept}' \
          )"

          curl -sS --fail-with-body \
            -H "Authorization: Bearer $CHARLIEHOOKS_SHARED_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$CHARLIEHOOKS_BASE_URL/hooks/github/deploy" \
            || echo "Warning: charliehooks deploy notification failed (deploy already succeeded)"
