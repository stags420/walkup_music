name: Deploy to GitHub Pages

on:
  push:
    branches: [v2.1]
  pull_request:
    branches: [v2.1]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROD_BRANCH: v2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Spotify client id (prod build/deploy)
        if: github.ref_name == env.PROD_BRANCH
        env:
          # Prefer an Actions repository variable; fall back to secrets for legacy setups.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID || secrets.VITE_SPOTIFY_CLIENT_ID || secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "${VITE_SPOTIFY_CLIENT_ID}" ] || [ "${VITE_SPOTIFY_CLIENT_ID}" = "REPLACE_ME_IN_.env.local" ]; then
            echo "Missing VITE_SPOTIFY_CLIENT_ID (required for GitHub Pages prod build/deploy)."
            echo "Set a repository Actions variable (preferred) or secret named VITE_SPOTIFY_CLIENT_ID (or SPOTIFY_CLIENT_ID)."
            exit 1
          fi

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID || secrets.VITE_SPOTIFY_CLIENT_ID || secrets.SPOTIFY_CLIENT_ID }}
        run: npm run build:prod

      - name: Deploy to GitHub Pages
        if: github.ref_name == env.PROD_BRANCH
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
